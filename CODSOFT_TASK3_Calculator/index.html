<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Tech Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <!-- Calculator Main Body -->
        <div class="calculator">
            <!-- Theme & Controls Bar -->
            <div class="top-bar">
                <span class="logo">EMERALD.calc</span>
                <button id="theme-toggle" class="theme-btn">🎨 Theme</button>
            </div>

            <!-- Display Screen -->
            <div class="display-screen">
                <div id="previous-operand" class="previous-operand"></div>
                <div id="current-operand" class="current-operand">0</div>
            </div>

            <!-- Button Grid -->
            <div class="buttons-grid">
                <button class="btn action" data-action="clear">AC</button>
                <button class="btn action" data-action="delete">DEL</button>
                <button class="btn operator" data-operator="%">%</button>
                <button class="btn operator" data-operator="/">÷</button>
                
                <button class="btn number" data-number="7">7</button>
                <button class="btn number" data-number="8">8</button>
                <button class="btn number" data-number="9">9</button>
                <button class="btn operator" data-operator="*">×</button>
                
                <button class="btn number" data-number="4">4</button>
                <button class="btn number" data-number="5">5</button>
                <button class="btn number" data-number="6">6</button>
                <button class="btn operator" data-operator="-">-</button>
                
                <button class="btn number" data-number="1">1</button>
                <button class="btn number" data-number="2">2</button>
                <button class="btn number" data-number="3">3</button>
                <button class="btn operator" data-operator="+">+</button>
                
                <button class="btn number" data-number="0">0</button>
                <button class="btn number" data-number=".">.</button>
                <button class="btn equals" data-action="calculate">=</button>
            </div>
        </div>

        <!-- New Feature: History Panel -->
        <div class="history-panel">
            <h3>History</h3>
            <ul id="history-list">
                <li class="empty-history">No calculations yet</li>
            </ul>
            <button id="clear-history" class="clear-hist-btn">Clear History</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
